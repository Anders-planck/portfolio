<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Pagina non trovata</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f1f1f1}
:root{
--color-accent:light-dark(#1b1b1b,#f1f1f1);--color-on-accent:light-dark(#ffffff,#111111);
--color-neutral:light-dark(#0000000F,#ffffff1A);--color-background-body:light-dark(#f1f1f1,#1b1b1b);--color-background-surface:light-dark(#ffffff,#262626);--color-background-gray:light-dark(#e2e2e2,#303030);
--color-text-primary:light-dark(#000000,#ffffff);--color-text-secondary:light-dark(#474747,#9e9e9e);
--color-border:light-dark(#00000014,#ffffff1A);
--color-background-blue:light-dark(#b9d7ff,#253c5a);--color-text-blue:light-dark(#003978,#a1caff);
--color-background-orange:light-dark(#ffc7a1,#503424);--color-text-orange:light-dark(#622700,#ffb37e);
--spacing-1:0.25rem;--spacing-2:0.5rem;--spacing-3:0.75rem;--spacing-4:1rem;--spacing-5:1.25rem;--spacing-6:1.5rem;--spacing-8:2rem;--spacing-12:3rem;
--radius-inner:8px;--radius-element:12px;--radius-container:16px;--radius-full:9999px;
--font-family-body:Figtree,system-ui,sans-serif;--font-family-code:"SF Mono",ui-monospace,monospace;
--font-size-sm:0.8rem;--font-size-base:1rem;--font-size-lg:1.25rem;--font-size-xl:1.563rem;--font-size-4xl:3.052rem;
}
a{color:var(--color-text-primary)}a:hover{color:var(--color-text-secondary)}
@keyframes heroRise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.hero-rise{animation:heroRise 975ms cubic-bezier(0.24,1,0.4,1) both}.hero-rise.d1{animation-delay:90ms}.hero-rise.d2{animation-delay:180ms}
@keyframes drift{0%,100%{translate:0 0}50%{translate:0 -10px}}
.piece{animation:drift 6s cubic-bezier(0.24,1,0.4,1) infinite;transition:transform 550ms cubic-bezier(0.24,1,0.4,1)}
.piece:hover{transform:rotate(0deg) translateY(-12px)!important}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(0.98)}to{opacity:1;transform:none}}
.menu{animation:menuIn 175ms cubic-bezier(0.24,1,0.4,1) both}
[data-magnetic]{transition:transform 410ms cubic-bezier(0.24,1,0.4,1)}
.cursor-ready .has-cursor,.cursor-ready .has-cursor a,.cursor-ready .has-cursor button{cursor:none}
@media (prefers-reduced-motion:reduce){.hero-rise,.piece,.menu{animation:none}}
</style>
</helmet>
<div class="has-cursor" style="color-scheme: light; position: relative; min-height: 100vh; overflow: hidden; background: var(--color-background-body); color: var(--color-text-primary); font-family: var(--font-family-body); font-size: var(--font-size-base); line-height: 1.5">
  <dc-import name="Motion" demo="{{ false }}" cursor="{{ true }}" hint-size="0px,0px"></dc-import>
  <header style="max-width: 80rem; margin: 0 auto; padding: var(--spacing-5) var(--spacing-8); display: flex; align-items: center; gap: var(--spacing-6)">
    <a href="Home.dc.html" style="flex-grow: 1; font-weight: 800; font-size: var(--font-size-lg); text-decoration: none; letter-spacing: -0.02em">anders/planck</a>
    <div style="position: relative">
      <button type="button" onClick="{{toggle}}" aria-expanded="{{expanded}}" aria-haspopup="menu" aria-label="Cambia lingua" style="all: unset; cursor: pointer; min-height: 44px; padding: 0 var(--spacing-4); display: inline-flex; align-items: center; gap: var(--spacing-2); border-radius: var(--radius-full); background: var(--color-neutral); font-size: var(--font-size-sm); font-weight: 700">{{current}}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
        <div class="menu" role="menu" aria-label="Lingua" style="position: absolute; right: 0; top: calc(100% + 8px); width: 15rem; padding: var(--spacing-2); border-radius: var(--radius-container); background: var(--color-background-surface); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12); z-index: 5; display: flex; flex-direction: column">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
            <button type="button" role="menuitemradio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="all: unset; cursor: pointer; min-height: 44px; padding: 0 var(--spacing-3); border-radius: var(--radius-element); display: flex; align-items: center; gap: var(--spacing-3); background: {{l.bg}}">
              <span style="font-family: var(--font-family-code); font-size: var(--font-size-sm); width: 1.5rem">{{l.code}}</span><span style="flex-grow: 1">{{l.name}}</span><span aria-hidden="true" style="font-weight: 700">{{l.mark}}</span>
            </button>
          </sc-for>
          <span style="padding: var(--spacing-2) var(--spacing-3) var(--spacing-1); font-size: var(--font-size-sm); color: var(--color-text-secondary); border-top: 1px solid var(--color-border); margin-top: var(--spacing-1)">Cambiando lingua resti sulla stessa pagina.</span>
        </div>
      </sc-if>
    </div>
  </header>

  <main style="max-width: 80rem; margin: 0 auto; padding: var(--spacing-12) var(--spacing-8); display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: var(--spacing-12); align-items: center">
    <div style="display: flex; flex-direction: column; gap: var(--spacing-5)">
      <span class="hero-rise" style="font-family: var(--font-family-code); font-size: var(--font-size-sm); color: var(--color-text-secondary)">Errore 404</span>
      <h1 class="hero-rise d1" style="margin: 0; font-size: var(--font-size-4xl); line-height: 1; font-weight: 800; letter-spacing: -0.03em">{{title}}</h1>
      <p class="hero-rise d2" style="margin: 0; max-width: 28rem; font-size: var(--font-size-lg); color: var(--color-text-secondary)">{{body}}</p>
      <div class="hero-rise d2" style="display: flex; gap: var(--spacing-3); flex-wrap: wrap">
        <a href="Home.dc.html" data-magnetic="" style="min-height: 48px; box-sizing: border-box; padding: var(--spacing-3) var(--spacing-6); display: inline-flex; align-items: center; border-radius: var(--radius-full); background: var(--color-accent); color: var(--color-on-accent); text-decoration: none; font-weight: 600">{{home}}</a>
        <a href="Lavori.dc.html" style="min-height: 48px; box-sizing: border-box; padding: var(--spacing-3) var(--spacing-6); display: inline-flex; align-items: center; border-radius: var(--radius-full); background: var(--color-neutral); text-decoration: none; font-weight: 600">{{work}}</a>
      </div>
    </div>
    <div role="img" aria-label="I pezzi del monolite sparsi a terra" style="position: relative; height: 26rem">
      <div class="piece" style="position: absolute; left: 6%; top: 34%; width: 8rem; height: 13rem; border-radius: var(--radius-element); background: var(--color-background-surface); border: 1px solid var(--color-border); transform: rotate(-18deg); animation-delay: 0ms"></div>
      <div class="piece" style="position: absolute; left: 30%; top: 12%; width: 8rem; height: 13rem; border-radius: var(--radius-element); background: var(--color-background-blue); transform: rotate(9deg); animation-delay: 400ms"></div>
      <div class="piece" style="position: absolute; left: 54%; top: 40%; width: 8rem; height: 13rem; border-radius: var(--radius-element); background: var(--color-accent); transform: rotate(-6deg); animation-delay: 800ms"></div>
      <div class="piece" style="position: absolute; left: 72%; top: 6%; width: 8rem; height: 13rem; border-radius: var(--radius-element); background: var(--color-background-orange); transform: rotate(22deg); animation-delay: 1200ms"></div>
      <div class="piece" style="position: absolute; left: 40%; top: 74%; width: 8rem; height: 5rem; border-radius: var(--radius-element); background: var(--color-background-gray); transform: rotate(4deg); animation-delay: 600ms"></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true, lang: 'it' }; }
  renderVals() {
    const copy = {
      it: { title: 'Questa pagina non esiste, o non più.', body: 'Il blocco si è smontato. Torniamo dove le cose sono al loro posto.', home: 'Torna alla home', work: 'Vai ai lavori' },
      en: { title: 'This page does not exist, or not anymore.', body: 'The block came apart. Let’s go back to where things are in place.', home: 'Back to home', work: 'See the work' },
      fr: { title: 'Cette page n’existe pas, ou plus.', body: 'Le bloc s’est défait. Revenons là où tout est à sa place.', home: 'Retour à l’accueil', work: 'Voir les projets' },
      de: { title: 'Diese Seite gibt es nicht, oder nicht mehr.', body: 'Der Block ist zerfallen. Zurück dorthin, wo alles an seinem Platz ist.', home: 'Zur Startseite', work: 'Zu den Projekten' }
    };
    const names = [['it', 'IT', 'Italiano'], ['en', 'EN', 'English'], ['fr', 'FR', 'Français'], ['de', 'DE', 'Deutsch']];
    const s = this.state; const c = copy[s.lang];
    return {
      open: s.open, expanded: s.open ? 'true' : 'false', current: s.lang.toUpperCase(),
      toggle: () => this.setState({ open: !this.state.open }),
      langs: names.map(([k, code, name]) => ({ code, name, on: s.lang === k ? 'true' : 'false', mark: s.lang === k ? '✓' : '', bg: s.lang === k ? 'var(--color-neutral)' : 'transparent', pick: () => this.setState({ lang: k, open: false }) })),
      title: c.title, body: c.body, home: c.home, work: c.work
    };
  }
}
</script>
</body>
</html>
